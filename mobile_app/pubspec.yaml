name: mobile_app
description: "CSM-GIAS Resto+ - Restaurant Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.4

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Logging
  logger: ^2.5.0

  # Platform detection
  universal_platform: ^1.1.0

  # Typography
  google_fonts: ^6.2.1

  # Loading skeletons
  shimmer: ^3.0.0

  # QR Scanning
  mobile_scanner: ^5.2.3

  # Share
  share_plus: ^10.1.4

  # Camera
  camera: ^0.11.0

  # Charts
  fl_chart: ^0.70.2
  excel: ^4.0.6
  # Keep aligned with Flutter's flutter_localizations SDK pin.
  intl: ^0.20.2
  path_provider: ^2.1.5
  pdf: ^3.11.2
  printing: ^5.14.2

  # ML Kit (on-device detection)
  # Keep these on the same ML Kit commons generation. Older 0.9.x commons
  # throws an Android InputImageConverterError on some CameraX devices.
  google_mlkit_face_detection: ^0.13.2
  google_mlkit_barcode_scanning: ^0.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_logo.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/branding/app_logo.png
